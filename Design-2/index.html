<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design 2 - Sunmall Chips</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/favicon.svg" type="image/x-icon" />
    <!-- remix icons cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!-- stylesheet  -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav>
      <div class="company-logo">
        <img src="./assets/Sunmall-logo.png" alt="sunmall logo" width="150" />
      </div>
      <div class="navbar">
        <div class="navitems">
          <a class="navitem" href="">Home</a>
          <a class="navitem" href="">About</a>
          <a class="navitem" href="">Chips</a>
          <a class="navitem" href="">Services</a>
          <a class="navitem" href="">Contact</a>
        </div>
        <div class="navbar-search">
          <i class="ri-search-line"></i>
          <input
            type="search"
            class="search-input"
            placeholder="Search for chips..."
          />
          <i class="ri-shopping-bag-fill"></i>
          <span class="cart-number">4</span>
        </div>
      </div>
    </nav>
    <main class="hero-section">
      <div class="left-section"></div>
      <div class="center-section"></div>
      <div class="right-section">
        <div class="product-highlight">
            <div class="product-icon">
                <img src="./assets/chilli.png" alt="chilli icon"/>
            </div>
            <div class="product-desc">
                <p class="product-title">extra chilli</p>
                <p class="product-subtitle">Zha Jiang mian is crazy hot even when it's simplified</p>
            </div>
        </div>
       <div class="product-highlight">
            <div class="product-icon">
                <img src="./assets/fire.png" alt="chilli icon"/>
            </div>
            <div class="product-desc">
                <p class="product-title">Beef flavour</p>
                <p class="product-subtitle">Comes with a lot extra energy calories and Oxizen</p>
            </div>
        </div>
        <div class="product-highlight">
            <div class="product-icon">
                <img src="./assets/chilli.png" alt="chilli icon"/>
            </div>
            <div class="product-desc">
                <p class="product-title">Smokey Sauce</p>
                <p class="product-subtitle">The meat sauce is kind of reminiscent of a Chinese.</p>
            </div>
        </div>
      </div>
    </main>
  </body>
</html>
